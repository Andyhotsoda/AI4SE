name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install fastapi uvicorn jinja2 aiofiles openai

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run mechanism demos
        run: |
          python demos/demo_guardrail_intercept.py
          python demos/demo_feedback_self_correction.py
          python demos/demo_deep_governance.py

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t coding-agent-harness .

      - name: Test Docker image
        run: docker run --rm coding-agent-harness python -m pytest tests/ -v --tb=short